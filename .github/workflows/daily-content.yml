name: Daily LinkedIn Content

# Runs the Purands AI agent pipeline daily and commits the generated review
# dashboards back into the repo. Nothing is posted to LinkedIn — output is for
# human review only.

on:
  schedule:
    - cron: "30 1 * * *"      # 01:30 UTC daily (~07:00 IST). Adjust as needed.
  workflow_dispatch:           # allow manual runs from the Actions tab

permissions:
  contents: write              # needed to commit the generated HTML back

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (the master copy)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate configuration
        working-directory: linkedin-agent
        run: python scripts/validate_config.py

      - name: Run agent pipeline
        working-directory: linkedin-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}      # optional
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    # provided automatically
          LOG_LEVEL: INFO
        run: python scripts/run_daily.py

      - name: Commit generated dashboards
        run: |
          git config user.name  "purands-content-bot"
          git config user.email "actions@github.com"
          git add linkedin-agent/output/ linkedin-agent/data/runs/ || true
          if git diff --cached --quiet; then
            echo "No new output to commit."
          else
            git commit -m "chore(content): daily run $(date -u +%Y-%m-%d)"
            git push
          fi
