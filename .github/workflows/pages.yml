name: Publish Dashboard to Pages

# Publishes the generated review dashboards to GitHub Pages so there is a stable
# URL to open each day (in addition to the files committed in the repo).
#
# Triggers:
#   - push to main touching the generated output (covers manual/local runs)
#   - after the "Daily LinkedIn Content" run finishes (covers the scheduled bot
#     commit, whose GITHUB_TOKEN push does not itself fire a push event)
#   - manual dispatch from the Actions tab

on:
  push:
    branches: [main]
    paths:
      - "linkedin-agent/output/daily/**"
      - "linkedin-agent/scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Daily LinkedIn Content"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build static site from dashboards
        run: python3 linkedin-agent/scripts/build_site.py _site

      - name: Configure Pages (enables Pages if not already on)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
