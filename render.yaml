# Render Blueprint — hosts the Purands AI Comment Studio (free tier).
# Deploy: Render dashboard → New → Blueprint → pick this repo. Then set the
# secret env vars (OPENAI_API_KEY, APIFY_TOKEN, STUDIO_PASSWORD) in the dashboard.
services:
  - type: web
    name: purands-comment-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir linkedin-agent studio.app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: OPENAI_API_KEY
        sync: false          # set the value in the Render dashboard (secret)
      - key: APIFY_TOKEN
        sync: false          # set the value in the Render dashboard (secret)
      - key: STUDIO_USER
        value: purands
      - key: STUDIO_PASSWORD
        sync: false          # set a password in the dashboard to lock the app
